# Crash resilience for the unattended appliance: any oops/panic reboots the
# box, and the crash text survives the reboot in ramoops (see patch 0004 for
# the reserved-memory node and DEVELOPMENT.md "Crash resilience").
#
# NB: do NOT do this via cmdline (oops=panic panic=5) - meta-sunxi's
# do_configure overwrites CONFIG_CMDLINE (see the note in usbproxy.cfg), so
# the Kconfig knobs are the reliable route.

# An oops means kernel state is already corrupted (the observed ones are
# random pointer corruption); don't limp on proxying traffic - panic.
CONFIG_PANIC_ON_OOPS=y
# The panic prints in full first, then the timer runs: reboot 5s later.
CONFIG_PANIC_TIMEOUT=5

# ramoops backend for the crash log (RAM rootfs = no on-disk logs). Read
# after the auto-reboot at /sys/fs/pstore (mounted from inittab).
CONFIG_PSTORE=y
CONFIG_PSTORE_RAM=y
CONFIG_PSTORE_CONSOLE=y

# Test hook for the panic/ramoops drill: echo c > /proc/sysrq-trigger.
CONFIG_MAGIC_SYSRQ=y
