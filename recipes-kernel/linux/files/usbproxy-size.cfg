# CONFIG_CRYPTO_CBC is not set
# CONFIG_CRYPTO_MD5 is not set
# CONFIG_CRYPTO_SHA1 is not set
# CONFIG_CRYPTO_SHA1_ARM is not set
# CONFIG_CRYPTO_SHA1_ARM_NEON is not set
# CONFIG_CRYPTO_SHA256_ARM is not set
# CONFIG_CRYPTO_AES_ARM_BS is not set
# CONFIG_CRYPTO_SIMD is not set
# CONFIG_CRYPTO_CRYPTD is not set
# CONFIG_CRYPTO_CRCT10DIF is not set
# CONFIG_CRYPTO_CRC64_ROCKSOFT is not set
# CONFIG_CRYPTO_HW is not set
# CONFIG_CRYPTO_DEV_ALLWINNER is not set
# CONFIG_CRYPTO_DEV_SUN4I_SS is not set
# CONFIG_CRYPTO_USER_API is not set

# Initramfs decoders: the bundled cpio is uncompressed; keep gzip only.
# CONFIG_RD_BZIP2 is not set
# CONFIG_RD_LZMA is not set
# CONFIG_RD_XZ is not set
# CONFIG_RD_LZO is not set
# CONFIG_RD_LZ4 is not set
# CONFIG_RD_ZSTD is not set

# Thumb-2 kernel: the same code in the 16/32-bit instruction set is about
# a quarter smaller. Cortex-A7 runs it natively; the oops unwinder
# (ARM_UNWIND) handles it.
CONFIG_THUMB2_KERNEL=y
