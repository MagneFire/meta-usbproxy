# usb-proxy appliance: kernel size trim (2026-10-03). Since the SPL Falcon
# boot the uImage is read by the SPL at ~23 MB/s and inflated by one core,
# so every MB of uImage is ~45 ms of boot plus its share of the LZ4 inflate.
# Measured before this fragment: .text 5.44 MB, .rodata 1.15 MB, ksymtab
# 0.21 MB, kernel part of the uImage 4.36 MB (LZ4). Everything below is
# either hardware this board does not have, a subsystem nothing in the
# RAM rootfs uses, or support for the other sunxi SoCs that the multi-SoC
# sunxi defconfig drags in. Checked against the DT: only ehci1/ohci1,
# uart0, usb_otg/usbphy, the GPIO cpu regulator and cpufreq are in use.
# The initramfs is bundled uncompressed (kernel.bbclass unpacks the
# cpio.gz before bundling), so the RD_* decoders are dead weight too.
# Kept on purpose: KALLSYMS (symbolic oopses in ramoops), ARM_UNWIND and
# STACKTRACE (backtraces), MAGIC_SYSRQ, PSTORE_COMPRESS, PRINTK_TIME.

# Only the H3 (sun8i). The other MACH_* pull in their CCU, pinctrl, timer
# and intc drivers (~250 KB of text+data). MACH_SUN7I stays: it is the
# only thing that selects HAVE_ARM_ARCH_TIMER (the H3 entry does not, the
# upstream defconfigs always carry SUN7I so nobody noticed), and without
# the architected timer the kernel fell back to the sun4i timer with a
# 10 ms jiffies sched_clock and cpu1 came up at 0.13 s instead of 0.017 s.
# Its own CCU and pinctrl are default-y on MACH_SUN7I and pinned off below.
# CONFIG_MACH_SUN4I is not set
# CONFIG_MACH_SUN5I is not set
# CONFIG_MACH_SUN6I is not set
CONFIG_MACH_SUN7I=y
# CONFIG_MACH_SUN9I is not set
# CONFIG_SUN4I_A10_CCU is not set
# CONFIG_SUN5I_CCU is not set
# CONFIG_SUN6I_A31_CCU is not set
# CONFIG_SUN8I_A23_CCU is not set
# CONFIG_SUN8I_A33_CCU is not set
# CONFIG_SUN8I_A83T_CCU is not set
# CONFIG_SUN8I_V3S_CCU is not set
# CONFIG_SUN8I_R40_CCU is not set
# CONFIG_SUN9I_A80_CCU is not set
# CONFIG_SUN8I_DE2_CCU is not set
# CONFIG_PINCTRL_SUN4I_A10 is not set
# CONFIG_PINCTRL_SUN5I is not set
# CONFIG_PINCTRL_SUN6I_A31 is not set
# CONFIG_PINCTRL_SUN6I_A31_R is not set
# CONFIG_PINCTRL_SUN8I_A23 is not set
# CONFIG_PINCTRL_SUN8I_A33 is not set
# CONFIG_PINCTRL_SUN8I_A83T is not set
# CONFIG_PINCTRL_SUN8I_A83T_R is not set
# CONFIG_PINCTRL_SUN8I_A23_R is not set
# CONFIG_PINCTRL_SUN8I_V3S is not set
# CONFIG_PINCTRL_SUN9I_A80 is not set
# CONFIG_PINCTRL_SUN9I_A80_R is not set
# CONFIG_PINCTRL_SUN20I_D1 is not set
# CONFIG_SUN5I_HSTIMER is not set
# CONFIG_SUN4I_INTC is not set
# CONFIG_PHY_SUN9I_USB is not set
# CONFIG_RTC_DRV_SUNXI is not set
# CONFIG_MFD_SUN6I_PRCM is not set
# CONFIG_ARM_CPUIDLE is not set

# No modules are ever installed (0 modules in the image): drop the
# loader and the export tables (__ksymtab*, 214 KB) and every =m leftover.
# CONFIG_MODULES is not set

# Block layer and everything on it: no MMC, no storage, no disks.
CONFIG_EXPERT=y
# CONFIG_BLOCK is not set
# CONFIG_SCSI is not set
# CONFIG_ATA is not set
# CONFIG_BLK_DEV_SD is not set
# CONFIG_BLK_DEV_RAM is not set
# CONFIG_BLK_DEV_BSG is not set
# CONFIG_BLK_DEV_INTEGRITY is not set
# CONFIG_SWAP is not set

# No keyboard, mouse, display or virtual console; the console is ttyS0
# and the USB CDC-ACM gadget.
# CONFIG_INPUT is not set
# CONFIG_HID_SUPPORT is not set
# CONFIG_VT is not set
# CONFIG_VT_CONSOLE is not set
# CONFIG_SERIAL_8250_DMA is not set
# CONFIG_SERIAL_8250_DW is not set
# CONFIG_SERIAL_8250_FSL is not set
# CONFIG_SERIAL_8250_16550A_VARIANTS is not set
CONFIG_SERIAL_8250_NR_UARTS=2
CONFIG_SERIAL_8250_RUNTIME_UARTS=2

# Buses and peripherals with no enabled DT node on this board.
# POWER_SUPPLY and EXTCON must stay: PHY_SUN4I_USB depends on both, and
# without the PHY musb and EHCI/OHCI drop out of the build (learned on
# the first try: Linux came up with no USB at all and no way in).
CONFIG_POWER_SUPPLY=y
CONFIG_EXTCON=y
CONFIG_PHY_SUN4I_USB=y
CONFIG_USB_MUSB_SUNXI=y
# CONFIG_I2C is not set
# CONFIG_SPI is not set
# CONFIG_PWM is not set
# CONFIG_DMADEVICES is not set
# CONFIG_THERMAL is not set
# CONFIG_HWMON is not set
# CONFIG_POWER_RESET is not set
# CONFIG_NVMEM is not set
# CONFIG_FW_LOADER is not set
# CONFIG_GPIO_CDEV is not set
# CONFIG_CPU_FREQ_GOV_ONDEMAND is not set

# Kernel features nothing here uses (BusyBox init + usb-proxy + libusb,
# which only needs AF_NETLINK for hotplug).
# CONFIG_BPF_SYSCALL is not set
# CONFIG_BPF_JIT is not set
# CONFIG_CGROUPS is not set
# CONFIG_NAMESPACES is not set
# CONFIG_NET_NS is not set
# CONFIG_PERF_EVENTS is not set
# CONFIG_HIBERNATION is not set
# CONFIG_SUSPEND is not set
# Dropping suspend took PM (runtime power management, which the clock and
# USB drivers use) and HOTPLUG_CPU/ARM_PSCI (the U-Boot proper boot path
# still brings cpu1 up through PSCI) down with it: keep them.
CONFIG_PM=y
CONFIG_HOTPLUG_CPU=y
CONFIG_ARM_PSCI=y
CONFIG_STACKTRACE=y
# CONFIG_CGROUP_SCHED is not set
# CONFIG_CPUSETS is not set
# CONFIG_MEMCG is not set
# CONFIG_BLK_CGROUP is not set
# CONFIG_SCHED_AUTOGROUP is not set
