# U-Boot config fragment for the usb-proxy appliance.

# DRAM stability. The Orange Pi Zero defaults to 624MHz DRAM, which is marginal
# on many units — especially when the board is powered over the micro-USB from a
# host port (voltage droop). The symptom is intermittent kernel oopses at boot
# with corrupt pointers (e.g. a page-clear faulting at a garbage address), i.e.
# random memory corruption. Lowering to 480MHz gives timing margin and draws a
# little less; a USB proxy isn't memory-bandwidth-bound so the cost is nil.
# (Most robust paired with a solid 5V supply rather than host-port power.)
# Update 2026-07-03: the oopses recurred (rarely) at 480. The prime suspect
# moved to the CPU DVFS rail switching, now eliminated by capping the CPU at
# 816MHz (kernel patch 0004). If corruption still recurs (check /sys/fs/pstore
# after the auto-reboot), the next knob is 480 -> 408 here.
# Update 2026-08-06: down to 312, taken mainly for STABILITY, with power as a
# small bonus. A lower DRAM clock gives more timing margin, and a USB proxy is
# nowhere near memory-bandwidth-bound (a few MB/s through ~16MB resident), so
# the bandwidth given up costs nothing measurable — throughput was unchanged at
# every step. Verified at 312: 18/18 clean boots, 3x50MB push + 2x50MB pull
# md5-exact, no pstore records.
#
# The power effect is REAL BUT SMALL: ~0.13 mW per MHz of DRAM clock, so 480 ->
# 312 is worth roughly 20mW. Read on before quoting a bigger number.
#
# HOW THAT WAS MEASURED, AND HOW IT WAS FIRST MEASURED WRONG. The individual
# steps (480->408, 408->360, 360->312) are each only 6-10mW, which is FAR below
# what a USB wattmeter can resolve on this rig: the reading flickers over a
# ~40mW band (0.30-0.34W) with the supply itself moving 5.14-5.15V. Worse, the
# first attempts were made with the watch still attached, and the watch is
# 0.24-0.30W of variable load that drifts with its own state. Under that method
# 480->408 "measured" 30mW and 408->360 "measured" 15mW — both drift, not
# signal. The giveaway was 312 reading HIGHER than 360, which is physically
# backwards; reflashing 360 then reproduced the same high number.
#
# What actually works: unplug the proxied device so only the SBC is on the
# meter, stub out the usb-proxy-run respawn loop, pin the board to one core at
# 648MHz, and compare a LARGE delta back-to-back in one sitting. 624 vs 360 done
# that way gives 0.37W vs 0.335W — ~35mW over a 1.73x clock change, cleanly
# above the noise. That single comparison is the only trustworthy DRAM
# measurement of the session; everything above is interpolated from it.
#
# So: do not try to justify one 48MHz step on the meter. It cannot be seen. Pick
# the clock on stability margin, which points the same way.
#
# 312 was also briefly written off as marginal, and that was WRONG — worth
# recording because the wrong diagnosis was so plausible. The first 312 attempt
# hung with the SPL printing "DRAM: 512 MiB" and U-Boot proper never running,
# which looks exactly like a DRAM setting that cannot init. It was not that:
# reflashed with crc32-in-RAM and readback checks it booted 18/18, and at the
# time a corrupt U-Boot on the card was blamed. The 2026-09-08 finding below
# gives the better explanation: "512 MiB" on this 256 MiB board IS the failure,
# a DRAM size misdetection in the SPL, and one that aliases inside the lower
# 256 MiB corrupts U-Boot proper before it prints. Keep the flash checks anyway
# (scripts/uboot-flash.py); a failed boot still proves nothing about DRAM
# unless the card holds what you think it does.
#
# DRAM SIZE DETECTION (2026-09-08). A good boot prints "DRAM: 256 MiB" in the
# SPL banner. Anything else is a detection failure, not a bigger board. The SPL
# sizes DRAM by aliasing tests (dram_sunxi_dw.c), and stock 2024.01 uses one
# write pair per test as the very first accesses after the controller is
# reconfigured; one missed alias at the row_bits=14 step and it reports
# 512 MiB. Linux then places mem_map at the top of the phantom half, which is
# a mirror of the real one, and the ramoops console header written at
# 0x4fc10000 lands on the struct page of an .init page: free_initmem() oopses
# in free_unref_page_prepare with a NULL deref at 0x80. Any such boot also wipes
# pstore before ramoops probes, so no crash record can survive it. Upstream hit
# the same "detected double the size" flake on H616 and fixed it with a
# 16-word pattern test (v2025.07), but only for H6/H616;
# 0001-sunxi-dw-dram-use-pattern-based-size-detection.patch ports that to the
# H3 driver. Flashed and soaked 2026-09-08: 23/23 warm reboots printed 256 MiB
# (one of them still oopsed in power-tune with a garbage maple-tree pointer, so
# the misdetection is not the only corruption source; see DEVELOPMENT.md §9).
# If a 512 banner ever shows up again, the next step is a hard expected-size
# check in the SPL (retry the DRAM init, then reset), not a clock.
#
# Iterating this no longer needs the SD card out of the board. The DRAM clock is
# compiled into the SPL, U-Boot has its own MMC driver, and bootdelay=0 can still
# be interrupted by spamming a key during boot — so a new U-Boot goes on over the
# serial console alone: scripts/uboot-console.py --catch, then
# scripts/uboot-flash.py (loady + mmc write). Step down one notch at a time and
# verify each. Note the recovery limit that the 312 attempt nearly hit: if the
# SPL cannot init DRAM at all there is no U-Boot prompt left to reflash through,
# and that means pulling the card.
CONFIG_DRAM_CLK=312

# Watchdog, armed from power-on. With CONFIG_WDT the sunxi WDT driver
# (WDT_SUNXI, default y) starts the hardware watchdog early in U-Boot and
# U-Boot feeds it itself; the kernel and then the busybox watchdog daemon
# (inittab) take over. A silent hang anywhere from U-Boot through userspace
# resets the board in <=8s (hardware max is 16s). Kernel panics/oopses reboot
# faster via panic_on_oops + panic timeout (usbproxy-resilience.cfg).
CONFIG_WDT=y
CONFIG_WATCHDOG_TIMEOUT_MSECS=8000
# AUTOSTART is "default n if ARCH_SUNXI" (an opt-out so FEL/dev workflows don't
# fight the WDT) — without it U-Boot prints "WDT: Not starting" and the boot
# window is unprotected. This appliance wants exactly the opposite.
CONFIG_WATCHDOG_AUTOSTART=y

# No interactive countdown before booting.
CONFIG_BOOTDELAY=0

# `loady <addr> <baud>`: switch the console to a faster rate for one Y-modem
# transfer and back afterwards. The serial console is the only channel that
# has never failed on this rig, but at 115200 the 6 MB bundled uImage takes
# 653 s to send; at 750000 it takes 136 s (43 KB/s, measured 2026-09-09).
# Ask only for a rate the UART divides 24 MHz/16 into exactly: 750000 (or
# 1500000/500000/375000). "921600" is accepted and printed but the divisor
# rounds it to 750000 on the wire, so the Mac side never syncs and the board
# sits waiting for ENTER at a rate nobody is sending.
# scripts/uboot-flash.py --baud and scripts/appliance.py --baud use it; both
# fall back to 115200 when U-Boot does not offer the switch.
CONFIG_SYS_LOADS_BAUD_CHANGE=y

# The kernel carries a bundled initramfs. sunxi's default max bootm load size
# (~8MB) is tight: the bundled uImage was ~10MB before trimming (failed with
# "uncompress error -28" / -ENOSPC) and is ~6MB now — under the default, but only
# just. Keep the limit raised so it still loads with headroom if the image grows.
CONFIG_SYS_BOOTM_LEN=0x4000000

# Don't scan USB at boot. sunxi sets CONFIG_PREBOOT="usb start" (to allow a USB
# keyboard to interrupt autoboot), which probes every USB bus before boot and
# costs noticeable time. This appliance is headless, so drop the USB keyboard
# and clear preboot — boot goes straight to MMC.
# (The Ethernet PHY power-down is done at runtime in /usr/bin/power-tune, which
# needs read-modify-write on shared CCU registers — awkward/untestable in a
# preboot string, clean in shell via devmem.)
# CONFIG_USB_KEYBOARD is not set
CONFIG_PREBOOT=""

# Power: this appliance is headless, so never bring up U-Boot video. With the
# stock sunxi video stack enabled, U-Boot probes display hardware and leaves the
# Display Engine bus clock ungated; the DRM-less trimmed kernel has no driver
# left to clean that up. Runtime power-tune still gates bus-de defensively, but
# disabling VIDEO avoids the extra clocking during the boot window too.
# CONFIG_VIDEO is not set

# Power: don't power up the on-SoC Ethernet PHY. u-boot's SUN8I_EMAC driver
# de-resets and clocks the H3 internal EPHY at probe (lighting the RJ45 LEDs and
# drawing ~150-250mW) purely so it can try net-boot. This appliance never net-
# boots (it boots from MMC), and the kernel has emac disabled too, so drop the
# driver entirely — the EPHY stays in its powered-down reset state.
# CONFIG_SUN8I_EMAC is not set

# Note on "disable USB boot": CMD_USB/CMD_PXE/CMD_DHCP are force-selected by
# U-Boot's distro defaults (which meta-sunxi's boot.scr flow relies on), so they
# can't be turned off with a plain fragment without breaking booting. It doesn't
# cost boot time: distro_bootcmd scans mmc0 first, finds boot.scr and boots, so
# the USB/network boot targets are never reached on a normal SD boot.
